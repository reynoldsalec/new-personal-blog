name: Validate Astro site
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: astro-site-preview
          path: dist
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts
      - name: Audit (allow GHSA-fc5q-39xc-vjpf, see new-personal-blog#2)
        run: |
          npm audit --json > audit.json || true
          jq -e '[.vulnerabilities[].via[] | objects
                  | select(.severity=="high" or .severity=="critical") | .url]
                 | unique
                 | map(select(endswith("GHSA-fc5q-39xc-vjpf") | not))
                 | length == 0' audit.json
