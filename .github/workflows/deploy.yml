name: Validate Astro site

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: astro-site-preview
          path: dist
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts
# Deliberately no production publish job. Enable publishing separately after review.
